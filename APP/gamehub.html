const container = document.getElementById('container');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",

    "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];

let fruitsZonesURL = "https://cdn.jsdelivr.net/gh/school-rgb/fruti-games-@main/game.json";
const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
const fruitsCoverURL = "https://cdn.jsdelivr.net/gh/school-rgb/COVER@main";
const fruitsHtmlURL = "https://cdn.jsdelivr.net/gh/school-rgb/html@main";

let zones = [];
let popularityData = {};
const featuredContainer = document.getElementById('featuredZones');

let playTimes = {};
try {
    const savedTimes = localStorage.getItem('frutiger_playTimes');
    if (savedTimes) {
        playTimes = JSON.parse(savedTimes);
    }
} catch (e) {
    playTimes = {};
}

let activePlayTimer = null;
let activeZoneId = null;

function sendInstallSignal(appName, appIconUrl, appPageUrl) {
  const payload = {
    type: 'INSTALL_APP',
    app: {
      name: appName,
      icon: appIconUrl,
      url: appPageUrl,
      isFromAppStore: true
    }
  };

  if (window.parent && window.parent !== window) {
    window.parent.postMessage(payload, '*');
  } else if (window.opener) {
    window.opener.postMessage(payload, '*');
  }
}

document.addEventListener('DOMContentLoaded', () => {
    const progressFill = document.getElementById('progress-fill');
    let currentProgress = 0;

    function simulateAssetLoading() {
        if (currentProgress < 100) {
            let jump = Math.random() * 7 + 1; 
            if (Math.random() > 0.85) {
                jump = 0; 
            }
            currentProgress += jump;
            if (currentProgress >= 100) {
                currentProgress = 100;
            }
            progressFill.style.width = `${currentProgress}%`;
            
            let delay = Math.random() * 120 + 20; 
            if (jump === 0) delay = Math.random() * 600 + 200;

            setTimeout(simulateAssetLoading, delay);
        }
    }
    simulateAssetLoading();
});

window.addEventListener('load', async () => {
    const progressFill = document.getElementById('progress-fill');
    if (progressFill) progressFill.style.width = '100%';
    
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('id');

    if (gameId) {
        // Try GN Math first
        currentLibrary = 'gn-math';
        await listZones();
        let foundZone = zones.find(z => z.id + '' === gameId);

        if (!foundZone) {
            // If not found in GN Math, automatically check Fruits library
            currentLibrary = 'fruits';
            document.getElementById('navGnMath').classList.remove('active');
            document.getElementById('navFruits').classList.add('active');
            document.getElementById('libraryHeading').textContent = 'Fruits Library';
            await listZones();
            foundZone = zones.find(z => z.id + '' === gameId);
        }

        if (foundZone) {
            // Enter immersive standalone mode: hide header, nav, controls, and show full-screen game only
            document.body.classList.add('app-fullscreen-mode');
            openZone(foundZone);
        }
    } else {
        await listZones();
    }

    setTimeout(() => {
        const splash = document.getElementById('appSplash');
        if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 500);
        }
    }, 400);
});

function toTitleCase(str) {
  return str.replace(
    /\w\S*/g,
    text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()
  );
}

async function switchLibraryType(type) {
    if (currentLibrary === type) return;
    
    const libSplash = document.getElementById('librarySplash');
    libSplash.style.display = 'flex';
    setTimeout(() => { libSplash.style.opacity = '1'; }, 10);

    currentLibrary = type;
    document.querySelectorAll('.bottom-nav-bar .nav-item').forEach(el => el.classList.remove('active'));
    
    if (type === 'gn-math') {
        document.getElementById('navGnMath').classList.add('active');
        document.getElementById('libraryHeading').textContent = 'GN Math Library';
    } else if (type === 'fruits') {
        document.getElementById('navFruits').classList.add('active');
        document.getElementById('libraryHeading').textContent = 'Fruits Library';
    }
    
    await listZones();

    setTimeout(() => {
        libSplash.style.opacity = '0';
        setTimeout(() => {
            libSplash.style.display = 'none';
        }, 300);
    }, 400);
}

async function listZones() {
    try {
        container.innerHTML = "Loading...";
        let targetURL = (currentLibrary === 'fruits') ? fruitsZonesURL : zonesURL;
        
        if (currentLibrary === 'gn-math') {
            try {
              let sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t="+Date.now());
              if (sharesponse && sharesponse.status === 200) {
                let shajson = await sharesponse.json();
                let sha = shajson[0]['sha'];
                if (sha) {
                    targetURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                }
              }
            } catch (error) {}
        } else if (currentLibrary === 'fruits') {
            try {
              let sharesponse = await fetch("https://api.github.com/repos/school-rgb/fruti-games-/commits?t="+Date.now());
              if (sharesponse && sharesponse.status === 200) {
                let shajson = await sharesponse.json();
                let sha = shajson[0]['sha'];
                if (sha) {
                    targetURL = `https://cdn.jsdelivr.net/gh/school-rgb/fruti-games-@${sha}/game.json`;
                }
              }
            } catch (error) {}
        }

        const response = await fetch(targetURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        if (zones.length > 0 && zones[0]) zones[0].featured = true;

        if (currentLibrary === 'gn-math') {
            await Promise.all([fetchPopularity("year"), fetchPopularity("month"), fetchPopularity("week"), fetchPopularity("day")]);
        }
        sortZones();
        
        let alltags = [];
        for (const obj of json) {
            if (Array.isArray(obj.special)) {
                alltags.push(...obj.special);
            }
        }

        alltags = [...new Set(alltags)];
        let filteroption = document.getElementById("filterOptions");
        if (filteroption && filteroption.children.length > 1) {
            while (filteroption.children.length > 1) {
                filteroption.removeChild(filteroption.lastElementChild);
            }
        }
        for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = toTitleCase(tag);
            filteroption.appendChild(opt);
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = `Error loading zones: ${error}`;
    }
}

async function fetchPopularity(duration) {
    try {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        const response = await fetch(
            "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration
        );
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[duration][id] = file.hits?.total ?? 0;
            }
        });
    } catch (error) {
        if (!popularityData[duration]) {
            popularityData[duration] = {};
        }
        popularityData[duration][0] = 0;
    }
}

function sortZones() {
    let workingZones = [...zones];
    const sortBy = sortOptions.value;
    if (sortBy === 'name') {
        workingZones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === 'id') {
        workingZones.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popular') {
        workingZones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingMonth') {
        workingZones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingWeek') {
        workingZones.sort((a, b) => ((popularityData['week']?.[b.id]) ?? 0) - ((popularityData['week']?.[a.id]) ?? 0));
    } else if (sortBy === 'trendingDay') {
        workingZones.sort((a, b) => ((popularityData['day']?.[b.id]) ?? 0) - ((popularityData['day']?.[a.id]) ?? 0));
    }
    workingZones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    displayZones(workingZones);
}

function formatPlayTime(seconds) {
    const d = Math.floor(seconds / (3600 * 24));
    const h = Math.floor((seconds % (3600 * 24)) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d)}d:${pad(h)}h:${pad(m)}m:${pad(s)}s`;
}

function displayZones(zonesList) {
    container.innerHTML = "";
    zonesList.forEach((file) => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        
        let activeCoverURL = (currentLibrary === 'fruits') ? fruitsCoverURL : coverURL;
        let activeHtmlURL = (currentLibrary === 'fruits') ? fruitsHtmlURL : htmlURL;

        const coverImgUrl = file.cover ? file.cover.replace("{COVER_URL}", activeCoverURL).replace("{HTML_URL}", activeHtmlURL) : '';
        zoneItem.style.backgroundImage = `url('${coverImgUrl}')`;
        zoneItem.onclick = () => openZone(file);

        const iconBox = document.createElement("div");
        iconBox.className = "zone-icon-box";
        const img = document.createElement("img");
        img.dataset.src = coverImgUrl;
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        iconBox.appendChild(img);
        zoneItem.appendChild(iconBox);

        const contentDiv = document.createElement("div");
        contentDiv.className = "zone-poster-content";

        const nameEl = document.createElement("h3");
        nameEl.className = "zone-name";
        nameEl.textContent = file.name;
        contentDiv.appendChild(nameEl);

        const teamEl = document.createElement("p");
        teamEl.className = "zone-team";
        teamEl.textContent = file.author ? file.author : "FRUTI TEAM";
        contentDiv.appendChild(teamEl);

        const timeEl = document.createElement("div");
        timeEl.className = "zone-time";
        timeEl.id = `playtime-label-${file.id}`;
        
        const currentSeconds = playTimes[file.id] || 0;
        timeEl.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Played: ${formatPlayTime(currentSeconds)}
        `;
        contentDiv.appendChild(timeEl);

        zoneItem.appendChild(contentDiv);
        container.appendChild(zoneItem);   
    });
    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    }

    const lazyImages = document.querySelectorAll('img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: "100px", 
        threshold: 0.1
    });

    lazyImages.forEach(img => {
        imageObserver.observe(img);
    });
}

function filterZones2() {
    const query = filterOptions.value;
    if (query === "none") {
        displayZones(zones);
    } else {
        const filteredZones = zones.filter(zone => zone.special?.includes(query));
        displayZones(filteredZones);
    }
}

function filterZones() {
    const query = searchBar.value.toLowerCase();
    const filteredZones = zones.filter(zone => zone.name.toLowerCase().includes(query));
    displayZones(filteredZones);
}

function openZone(file) {
    if (activePlayTimer) clearInterval(activePlayTimer);
    activeZoneId = file.id;
    if (!playTimes[activeZoneId]) playTimes[activeZoneId] = 0;

    activePlayTimer = setInterval(() => {
        playTimes[activeZoneId]++;
        
        try {
            localStorage.setItem('frutiger_playTimes', JSON.stringify(playTimes));
        } catch (e) {}

        const label = document.getElementById(`playtime-label-${activeZoneId}`);
        if (label) {
            label.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Played: ${formatPlayTime(playTimes[activeZoneId])}
            `;
        }
    }, 1000);

    let activeCoverURL = (currentLibrary === 'fruits') ? fruitsCoverURL : coverURL;
    let activeHtmlURL = (currentLibrary === 'fruits') ? fruitsHtmlURL : htmlURL;

    // Ensure iframe exists
    if (!zoneFrame || zoneFrame.contentDocument === null) {
        zoneFrame = document.createElement("iframe");
        zoneFrame.id = "zoneFrame";
        zoneViewer.appendChild(zoneFrame);
    }

    if (file.url.startsWith("http")) {
        zoneFrame.src = file.url;
    } else {
        const url = file.url.replace("{COVER_URL}", activeCoverURL).replace("{HTML_URL}", activeHtmlURL);
        
        fetch(url + "?t=" + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error("File not found (404)");
                }
                return response.text();
            })
            .then(html => {
                html = html.replace(/<script>\s*\(function\(ykJYJgqRQvLQ[\s\S]*?<\/script>/g, '');
                zoneFrame.contentDocument.open();
                zoneFrame.contentDocument.write(html);
                zoneFrame.contentDocument.close();
            })
            .catch(error => {
                const fallbackHtml = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <style>
                            body {
                                background: #000000;
                                color: #ffffff;
                                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                height: 100vh;
                                margin: 0;
                                text-align: center;
                                padding: 20px;
                            }
                            h1 { color: #fc2651; font-size: 24px; margin-bottom: 10px; }
                            p { color: #8e8e93; font-size: 15px; max-width: 400px; line-height: 1.5; }
                        </style>
                    </head>
                    <body>
                        <h1>Game File Missing</h1>
                        <p>The game link or HTML file for "<strong>${file.name}</strong>" could not be found. Please check your JSON link or upload the file to your repository.</p>
                    </body>
                    </html>
                `;
                zoneFrame.contentDocument.open();
                zoneFrame.contentDocument.write(fallbackHtml);
                zoneFrame.contentDocument.close();
            });
    }

    document.getElementById('zoneName').textContent = file.name;
    document.getElementById('zoneId').textContent = file.id;
    document.getElementById('zoneAuthor').textContent = "by " + (file.author || "Unknown");
    if (file.authorLink) {
        document.getElementById('zoneAuthor').href = file.authorLink;
    }
    
    zoneViewer.style.display = "flex";
    
    try {
        const historyUrl = new URL(window.location);
        historyUrl.searchParams.set('id', file.id);
        history.pushState(null, '', historyUrl.toString());
    } catch(error){}
}

function aboutBlank() {
    const newWindow = window.open("about:blank", "_blank");
    let activeCoverURL = (currentLibrary === 'fruits') ? fruitsCoverURL : coverURL;
    let activeHtmlURL = (currentLibrary === 'fruits') ? fruitsHtmlURL : htmlURL;

    let targetZone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent);
    if (!targetZone) return;

    if (targetZone.url.startsWith("http")) {
        if (newWindow) {
            newWindow.location.href = targetZone.url;
        }
    } else {
        let zone = targetZone.url.replace("{COVER_URL}", activeCoverURL).replace("{HTML_URL}", activeHtmlURL);
        fetch(zone+"?t="+Date.now()).then(response => response.text()).then(text => {
            text = text.replace(/<script>\s*\(function\(ykJYJgqRQvLQ[\s\S]*?<\/script>/g, '');
            if (newWindow) {
                newWindow.document.open();
                newWindow.document.write(text);
                newWindow.document.close();
            }
        });
    }
}

function closeZone() {
    if (activePlayTimer) {
        clearInterval(activePlayTimer);
        try {
            localStorage.setItem('frutiger_playTimes', JSON.stringify(playTimes));
        } catch (e) {}
        activePlayTimer = null;
        activeZoneId = null;
    }
    document.body.classList.remove('app-fullscreen-mode');
    zoneViewer.style.display = "none";
    if (zoneFrame && zoneViewer.contains(zoneFrame)) {
        zoneViewer.removeChild(zoneFrame);
    }
    try {
        const url = new URL(window.location);
        url.searchParams.delete('id');
        history.pushState(null, '', url.toString());
    } catch(error){}
}

function downloadZone() {
    let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent);
    if (!zone) return;

    let activeCoverURL = (currentLibrary === 'fruits') ? fruitsCoverURL : coverURL;
    let activeHtmlURL = (currentLibrary === 'fruits') ? fruitsHtmlURL : htmlURL;

    const iconUrl = zone.cover ? zone.cover.replace("{COVER_URL}", activeCoverURL).replace("{HTML_URL}", activeHtmlURL) : '';
    const pageUrl = window.location.origin + window.location.pathname + "?id=" + zone.id;

    sendInstallSignal(zone.name, iconUrl, pageUrl);
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) {
        zoneFrame.requestFullscreen();
    } else if (zoneFrame.mozRequestFullScreen) {
        zoneFrame.mozRequestFullScreen();
    } else if (zoneFrame.webkitRequestFullscreen) {
        zoneFrame.webkitRequestFullscreen();
    } else if (zoneFrame.msRequestFullscreen) {
        zoneFrame.msRequestFullscreen();
    }
}
