<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-white antialiased select-none overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monochrome Navigation Sidebar</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
          },
          colors: {
            mono: {
              950: '#050505',
              900: '#0a0a0a',
              850: '#121212',
              800: '#1a1a1a',
              700: '#222222',
              600: '#333333',
              500: '#666666',
              400: '#888888',
              300: '#aaaaaa',
              200: '#cccccc',
              100: '#e5e5e5',
              50: '#ffffff'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link id="dynamicFavicon" rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=1iF9PyJ2Thzo&format=png&color=FFFFFF">

  <style>
    /* Custom OTF Font Integration */
    @font-face {
      font-family: 'Electroharmonix';
      src: url('Electroharmonix.otf') format('opentype'),
           url('https://db.onlinewebfonts.com/t/7946caedfe3335bf3bfdcf66dfc1ed44.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    .font-electro {
      font-family: 'Electroharmonix', 'Inter', system-ui, sans-serif;
      letter-spacing: 0.15em;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #050505;
    }

    /* Active Indicator Line Smooth Sliding Transition */
    .indicator-line {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
    }

    /* Fast Partial Fade Animation (~0.22 opacity dip) */
    @keyframes fastPartialFade {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      35% {
        opacity: 0.22;
        transform: scale(0.988);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-fast-fade {
      animation: fastPartialFade 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    input::placeholder {
      color: #555555;
    }
  </style>
</head>
<body class="h-screen w-screen bg-[#050505] text-mono-100 flex items-center justify-start overflow-hidden font-sans relative">

  <!-- Interactive Background Canvas (Visible on Home & Loading screens) -->
  <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0 w-full h-full"></canvas>

  <!-- 100% Viewport Height Sidebar (Edge-to-edge 60px vertical strip on left) -->
  <aside id="sidebar" class="h-screen w-[60px] bg-[#0a0a0a] border-r border-[#1a1a1a] flex flex-col justify-between items-center py-4 relative z-50 select-none shrink-0">
    
    <!-- Active Indicator Bar: Height 20px, Width 3px, Solid White Pill -->
    <div id="activeIndicator" class="indicator-line absolute left-0 w-[3px] h-[20px] bg-white rounded-r-full z-40 pointer-events-none shadow-[0_0_10px_rgba(255,255,255,0.8)]" style="top: 0px; transform: translateY(0px);"></div>

    <!-- UPPER SECTION: Primary navigation apps (Home to Anime) -->
    <div class="w-full flex flex-col items-center">
      <nav class="w-full flex flex-col items-center gap-1.5 px-1" aria-label="Primary Navigation">
        
        <!-- 1. HOME -->
        <button data-nav-id="home" data-subtitle="HOME" data-index="0" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Home">
          <img src="https://img.icons8.com/?size=100&id=1iF9PyJ2Thzo&format=png&color=FFFFFF" alt="Home" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'home')">
        </button>

        <!-- 2. GAMES -->
        <button data-nav-id="games" data-subtitle="GAMES" data-index="1" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Games">
          <img src="https://img.icons8.com/?size=100&id=GFDbOB2OqPWt&format=png&color=FFFFFF" alt="Games" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'games')">
        </button>

        <!-- 3. MUSIC -->
        <button data-nav-id="music" data-subtitle="MUSIC" data-index="2" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Music">
          <img src="https://img.icons8.com/?size=100&id=cpC9tCaQDyxh&format=png&color=FFFFFF" alt="Music" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'music')">
        </button>

        <!-- 4. MOVIES -->
        <button data-nav-id="movies" data-subtitle="MOVIES" data-index="3" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Movies">
          <img src="https://img.icons8.com/?size=100&id=xmdB5b5JmqRr&format=png&color=FFFFFF" alt="Movies" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'movies')">
        </button>

        <!-- 5. ANIME -->
        <button data-nav-id="anime" data-subtitle="ANIME" data-index="4" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Anime">
          <img src="https://img.icons8.com/?size=100&id=RHbEtcSp-frn&format=png&color=FFFFFF" alt="Anime" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'anime')">
        </button>
      </nav>
    </div>

    <!-- LOWER SECTION: Dividers, Clock Stream & Settings -->
    <div class="w-full flex flex-col items-center px-1 mt-auto">
      
      <!-- FIRST DIVIDER LINE ABOVE CLOCK STREAM -->
      <div class="w-6 h-[1px] bg-[#222222] mb-1.5 rounded-full"></div>

      <!-- UNBOXED 2-CHARACTER VERTICAL CLOCK & DATE STREAM -->
      <div id="clockStream" class="flex flex-col items-center font-mono text-[9px] leading-[1.2] tracking-widest text-[#666666] font-medium mb-1.5 select-none">
        <span id="stHours" class="text-mono-300 font-semibold">08</span>
        <span id="stMinutes" class="text-mono-400">05</span>
        <span id="stPeriod" class="text-[8px] text-mono-500 font-bold">PM</span>
        <span class="text-[#333333] my-[1px]">—</span>
        <span id="stMonth1" class="text-mono-400">OC</span>
        <span id="stMonth2" class="text-mono-500">T </span>
        <span id="stDay" class="text-mono-300 font-semibold">01</span>
        <span id="stYear" class="text-mono-500">26</span>
      </div>

      <!-- SECOND DIVIDER LINE BELOW CLOCK STREAM -->
      <div class="w-6 h-[1px] bg-[#222222] mb-1.5 rounded-full"></div>

      <!-- 6. SETTINGS -->
      <nav class="w-full flex flex-col items-center" aria-label="Settings Navigation">
        <button data-nav-id="settings" data-subtitle="SETTINGS" data-index="5" class="nav-btn group relative w-9 h-9 rounded-lg flex items-center justify-center text-mono-400 hover:text-white hover:bg-[#181818] active:scale-95 transition-all duration-150" aria-label="Settings">
          <img src="https://img.icons8.com/?size=100&id=84040&format=png&color=FFFFFF" alt="Settings" class="w-[14px] h-[14px] object-contain transition-transform duration-200 group-hover:scale-110" onerror="handleImgError(this, 'settings')">
        </button>
      </nav>

    </div>

  </aside>

  <!-- Floating Hover Tooltip -->
  <div id="tooltip" class="fixed left-[70px] bg-[#141414] text-white text-[10px] font-mono tracking-widest px-2.5 py-1 rounded-md border border-[#2a2a2a] shadow-2xl opacity-0 pointer-events-none z-50 transition-opacity duration-150 flex items-center uppercase">
    <span id="tooltipText">HOME</span>
  </div>

  <!-- Main Display Area -->
  <main id="mainContainer" class="flex-1 h-screen bg-transparent flex flex-col items-center justify-center text-center p-0 relative overflow-hidden z-10">

    <div id="mainDisplay" class="flex flex-col items-center justify-center w-full h-full z-10">

      <!-- Hero Title (Home View with Electroharmonix Font) -->
      <h1 id="heroTitle" class="font-electro text-3xl sm:text-5xl md:text-7xl font-bold tracking-[0.18em] text-white uppercase text-center drop-shadow-[0_0_30px_rgba(255,255,255,0.25)] leading-none mb-3">
        THURSDAY
      </h1>

      <!-- Full Date Display -->
      <div id="heroDate" class="text-sm sm:text-lg md:text-xl font-mono tracking-[0.25em] text-mono-300 uppercase mb-2 font-semibold">
        OCTOBER 1, 2026
      </div>

      <!-- Subtitle (Electroharmonix Font) -->
      <p id="welcomeSubtitle" class="font-electro text-[10px] sm:text-xs font-semibold tracking-[0.35em] text-mono-400 uppercase">
        WELCOME TO FRUITIGER
      </p>

      <!-- Category Content Container -->
      <div id="sectionContent" class="w-full h-full hidden relative">
        <!-- Dynamic content injected via JavaScript -->
      </div>

    </div>

  </main>

  <!-- Application JavaScript Logic -->
  <script>
    const appUrls = {
      games: 'APP/gamehub.html',
      music: 'APP/music.html',
      movies: 'https://school-rgb.github.io/frutimovies/',
      anime: 'https://school-rgb.github.io/anime-movies-in-html/'
    };

    let activeIndex = 0;
    let isAppLoading = false;
    let canvas, ctx;
    let particles = [];
    let mouse = { x: -1000, y: -1000, radius: 120 };

    class Particle {
      constructor(w, h) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.size = Math.random() * 2 + 1.2;
      }
      update(w, h) {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;

        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < mouse.radius) {
          const angle = Math.atan2(dy, dx);
          const force = (mouse.radius - dist) / mouse.radius;
          this.x -= Math.cos(angle) * force * 3;
          this.y -= Math.sin(angle) * force * 3;
        }
      }
      draw(ctx) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initCanvas() {
      canvas = document.getElementById('bgCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      particles = [];
      const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 14000);
      for (let i = 0; i < Math.max(30, Math.min(particleCount, 80)); i++) {
        particles.push(new Particle(canvas.width, canvas.height));
      }

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });

      animateCanvas();
    }

    function animateCanvas() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeIndex === 0 || isAppLoading) {
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(canvas.width, canvas.height);
          particles[i].draw(ctx);
        }

        for (let a = 0; a < particles.length; a++) {
          for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 120) {
              const alpha = (1 - dist / 120) * 0.35;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.stroke();
            }
          }
        }
      }

      requestAnimationFrame(animateCanvas);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initCanvas();

      const sidebar = document.getElementById('sidebar');
      const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
      const activeIndicator = document.getElementById('activeIndicator');
      const tooltip = document.getElementById('tooltip');
      const tooltipText = document.getElementById('tooltipText');
      const mainContainer = document.getElementById('mainContainer');
      const mainDisplay = document.getElementById('mainDisplay');
      const heroTitle = document.getElementById('heroTitle');
      const heroDate = document.getElementById('heroDate');
      const welcomeSubtitle = document.getElementById('welcomeSubtitle');
      const sectionContent = document.getElementById('sectionContent');

      const stHours = document.getElementById('stHours');
      const stMinutes = document.getElementById('stMinutes');
      const stPeriod = document.getElementById('stPeriod');
      const stMonth1 = document.getElementById('stMonth1');
      const stMonth2 = document.getElementById('stMonth2');
      const stDay = document.getElementById('stDay');
      const stYear = document.getElementById('stYear');

      const daysOfWeek = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const allMonths = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

      function updateClockAndStream() {
        const now = new Date();

        let rawHours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const period = rawHours >= 12 ? 'PM' : 'AM';
        rawHours = rawHours % 12;
        rawHours = rawHours ? rawHours : 12;
        const hours = String(rawHours).padStart(2, '0');

        const dayOfWeekName = daysOfWeek[now.getDay()];
        const monthName = allMonths[now.getMonth()];
        const dateNum = String(now.getDate()).padStart(2, '0');
        const yearFull = String(now.getFullYear());
        const yearShort = yearFull.slice(-2);

        const monthShort = monthName.slice(0, 3);
        const m1 = monthShort.slice(0, 2);
        const m2 = (monthShort.slice(2, 3) + ' ').slice(0, 2);

        stHours.textContent = hours;
        stMinutes.textContent = minutes;
        stPeriod.textContent = period;
        stMonth1.textContent = m1;
        stMonth2.textContent = m2;
        stDay.textContent = dateNum;
        stYear.textContent = yearShort;

        if (activeIndex === 0) {
          heroTitle.textContent = dayOfWeekName;
          heroDate.textContent = `${monthName} ${parseInt(dateNum, 10)}, ${yearFull}`;
        }
      }

      updateClockAndStream();
      setInterval(updateClockAndStream, 1000);

      function updateIndicator(btn) {
        if (!btn) return;
        const iconImg = btn.querySelector('img') || btn.querySelector('svg');
        const sidebarRect = sidebar.getBoundingClientRect();

        if (iconImg) {
          const iconRect = iconImg.getBoundingClientRect();
          const topPos = iconRect.top - sidebarRect.top;
          activeIndicator.style.transform = `translateY(${topPos}px)`;
        } else {
          const btnRect = btn.getBoundingClientRect();
          const indicatorHeight = 20;
          const btnCenterY = btnRect.top - sidebarRect.top + (btnRect.height / 2);
          const topPos = btnCenterY - (indicatorHeight / 2);
          activeIndicator.style.transform = `translateY(${topPos}px)`;
        }
      }

      function setNavIndex(index) {
        if (index < 0 || index >= navButtons.length) return;

        activeIndex = index;
        const targetBtn = navButtons[activeIndex];
        const subtitle = targetBtn.getAttribute('data-subtitle');

        navButtons.forEach(btn => {
          btn.classList.remove('bg-[#181818]', 'text-white');
          btn.classList.add('text-mono-400');
        });

        targetBtn.classList.remove('text-mono-400');
        targetBtn.classList.add('bg-[#181818]', 'text-white');

        updateIndicator(targetBtn);

        mainDisplay.classList.remove('animate-fast-fade');
        void mainDisplay.offsetWidth;
        mainDisplay.classList.add('animate-fast-fade');

        const now = new Date();
        const currentDayName = daysOfWeek[now.getDay()];
        const monthName = allMonths[now.getMonth()];
        const dateNum = now.getDate();
        const yearFull = now.getFullYear();

        if (subtitle === 'HOME') {
          isAppLoading = false;
          mainContainer.className = "flex-1 h-screen bg-transparent flex flex-col items-center justify-center text-center p-0 relative overflow-hidden z-10";
          mainDisplay.className = "flex flex-col items-center justify-center w-full h-full z-10";
          heroTitle.textContent = currentDayName;
          heroTitle.classList.remove('hidden');
          heroDate.textContent = `${monthName} ${dateNum}, ${yearFull}`;
          heroDate.classList.remove('hidden');
          welcomeSubtitle.textContent = 'WELCOME TO FRUITIGER';
          welcomeSubtitle.classList.remove('hidden');
          sectionContent.className = "w-full h-full hidden";
        } else if (['GAMES', 'MUSIC', 'MOVIES', 'ANIME'].includes(subtitle)) {
          isAppLoading = true;
          mainContainer.className = "flex-1 h-screen bg-black flex flex-col relative overflow-hidden p-0 z-10";
          mainDisplay.className = "w-full h-full z-10 flex flex-col relative";
          heroTitle.classList.add('hidden');
          heroDate.classList.add('hidden');
          welcomeSubtitle.classList.add('hidden');
          sectionContent.className = "w-full h-full block relative";

          const urlKey = subtitle.toLowerCase();
          const targetUrl = appUrls[urlKey];

          sectionContent.innerHTML = `
            <div id="appLoader" class="absolute inset-0 bg-black/75 backdrop-blur-xs z-30 flex flex-col items-center justify-center font-mono gap-3 transition-opacity duration-300">
              <div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
              <span class="text-xs tracking-[0.3em] text-white font-bold uppercase">LOADING ${subtitle}...</span>
            </div>
            <iframe id="appIframe" src="${targetUrl}" class="w-full h-full border-0 relative z-10 opacity-0 transition-opacity duration-300" title="${subtitle}" loading="lazy"></iframe>
          `;

          const iframeEl = document.getElementById('appIframe');
          const loaderEl = document.getElementById('appLoader');

          const handleLoaded = () => {
            setTimeout(() => {
              isAppLoading = false;
              if (loaderEl) loaderEl.classList.add('opacity-0', 'pointer-events-none');
              if (iframeEl) iframeEl.classList.remove('opacity-0');
            }, 500);
          };

          iframeEl.addEventListener('load', handleLoaded);
          setTimeout(handleLoaded, 2500);

        } else if (subtitle === 'SETTINGS') {
          isAppLoading = false;
          mainContainer.className = "flex-1 h-screen bg-[#050505] flex flex-col items-center justify-start text-center p-8 relative overflow-y-auto z-10 select-text";
          mainDisplay.className = "w-full max-w-md flex flex-col items-center justify-start pt-16 gap-6 text-center";
          heroTitle.classList.add('hidden');
          heroDate.classList.add('hidden');
          welcomeSubtitle.classList.add('hidden');
          sectionContent.className = "w-full block";

          renderSettingsView();
        }
      }

      function updateTabInfo(title, iconUrl) {
        if (title) {
          document.title = title;
        }
        if (iconUrl) {
          let favicon = document.getElementById('dynamicFavicon');
          if (!favicon) {
            favicon = document.createElement('link');
            favicon.id = 'dynamicFavicon';
            favicon.rel = 'icon';
            document.head.appendChild(favicon);
          }
          favicon.href = iconUrl;
        }
      }

      function renderSettingsView() {
        const currentTitle = document.title;
        const currentFavicon = document.getElementById('dynamicFavicon')?.href || '';

        sectionContent.innerHTML = `
          <div class="w-full flex flex-col items-center text-center space-y-6 font-mono text-xs tracking-wider">
            
            <div class="text-mono-400 uppercase tracking-[0.25em] text-[11px] font-semibold border-b border-[#222222] pb-2 w-full max-w-xs text-center">
              TAB CLOAKING & CUSTOMIZATION
            </div>

            <!-- Quick Presets -->
            <div class="flex flex-col items-center gap-2 w-full max-w-xs">
              <span class="text-[10px] text-mono-500 uppercase tracking-widest">QUICK CLOAK PRESETS</span>
              <div class="grid grid-cols-3 gap-2 w-full">
                <button id="presetGoogle" class="px-2 py-2 bg-[#121212] hover:bg-[#1f1f1f] border border-[#2a2a2a] rounded-md text-[10px] text-mono-200 transition-colors font-bold">
                  GOOGLE
                </button>
                <button id="presetDrive" class="px-2 py-2 bg-[#121212] hover:bg-[#1f1f1f] border border-[#2a2a2a] rounded-md text-[10px] text-mono-200 transition-colors font-bold">
                  DRIVE
                </button>
                <button id="presetCanvas" class="px-2 py-2 bg-[#121212] hover:bg-[#1f1f1f] border border-[#2a2a2a] rounded-md text-[10px] text-mono-200 transition-colors font-bold">
                  CANVAS
                </button>
              </div>
            </div>

            <!-- Custom Title & Favicon Input -->
            <div class="flex flex-col gap-3 w-full max-w-xs text-left pt-1">
              <label class="flex flex-col gap-1">
                <span class="text-[10px] text-mono-400 uppercase font-semibold">CUSTOM TAB TITLE</span>
                <input id="tabTitleInput" type="text" value="${currentTitle}" placeholder="e.g. Google Search" class="bg-[#121212] border border-[#2a2a2a] rounded-md px-3 py-2 text-xs text-white focus:outline-none focus:border-mono-400 font-sans">
              </label>

              <label class="flex flex-col gap-1">
                <span class="text-[10px] text-mono-400 uppercase font-semibold">CUSTOM FAVICON URL</span>
                <input id="tabIconInput" type="text" value="${currentFavicon}" placeholder="https://example.com/favicon.ico" class="bg-[#121212] border border-[#2a2a2a] rounded-md px-3 py-2 text-xs text-white focus:outline-none focus:border-mono-400 font-sans">
              </label>

              <button id="applyTabCustom" class="mt-2 w-full py-2.5 bg-white text-black font-bold text-xs uppercase rounded-md hover:bg-mono-200 active:scale-95 transition-all">
                APPLY TAB CLOAK
              </button>
            </div>

          </div>
        `;

        document.getElementById('presetGoogle').addEventListener('click', () => {
          const t = 'Google';
          const i = 'https://www.google.com/favicon.ico';
          document.getElementById('tabTitleInput').value = t;
          document.getElementById('tabIconInput').value = i;
          updateTabInfo(t, i);
        });

        document.getElementById('presetDrive').addEventListener('click', () => {
          const t = 'My Drive - Google Drive';
          const i = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
          document.getElementById('tabTitleInput').value = t;
          document.getElementById('tabIconInput').value = i;
          updateTabInfo(t, i);
        });

        document.getElementById('presetCanvas').addEventListener('click', () => {
          const t = 'Dashboard';
          const i = 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico';
          document.getElementById('tabTitleInput').value = t;
          document.getElementById('tabIconInput').value = i;
          updateTabInfo(t, i);
        });

        document.getElementById('applyTabCustom').addEventListener('click', () => {
          const t = document.getElementById('tabTitleInput').value;
          const i = document.getElementById('tabIconInput').value;
          updateTabInfo(t, i);
        });
      }

      navButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => {
          setNavIndex(index);
        });

        btn.addEventListener('mouseenter', () => {
          const subtitle = btn.getAttribute('data-subtitle');
          tooltipText.textContent = subtitle;

          const btnRect = btn.getBoundingClientRect();
          tooltip.style.top = `${btnRect.top + (btnRect.height / 2) - 12}px`;
          tooltip.classList.remove('opacity-0', 'pointer-events-none');
          tooltip.classList.add('opacity-100');
        });

        btn.addEventListener('mouseleave', () => {
          tooltip.classList.add('opacity-0', 'pointer-events-none');
          tooltip.classList.remove('opacity-100');
        });
      });

      setNavIndex(0);

      window.addEventListener('resize', () => {
        updateIndicator(navButtons[activeIndex]);
      });
    });

    function handleImgError(imgElement, type) {
      const svgs = {
        'home': `<svg class="w-[14px] h-[14px] text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.75L12 3l9 6.75V21a1 1 0 01-1 1H15a1 1 0 01-1-1v-5a1 1 0 00-1-1h-2a1 1 0 00-1 1v5a1 1 0 01-1 1H4a1 1 0 01-1-1V9.75z"/></svg>`,
        'games': `<svg class="w-[14px] h-[14px] text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12h.01M18 12h.01M6 10h4m-2-2v4M6 6h12a6 6 0 016 6v3a3 3 0 01-3 3h-2.5a1.5 1.5 0 00-1.2.6l-1.6 2.133a1.5 1.5 0 01-2.4 0l-1.6-2.133a1.5 1.5 0 00-1.2-.6H5a3 3 0 01-3-3v-3a6 6 0 016-6z"/></svg>`,

        'anime': `<svg class="w-[14px] h-[14px] text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>`,
        'settings': `<svg class="w-[14px] h-[14px] text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>`
      };

      const parent = imgElement.parentElement;
      if (parent && svgs[type]) {
        parent.innerHTML = svgs[type];
      }
    }
  </script>
